
<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  </style>
</head>
<body>
  
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a144d" />
      <stop offset="70%" stop-color="#140a28" />
      <stop offset="100%" stop-color="#090414" />
    </radialGradient>
    <linearGradient id="partyHatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#9900ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Neon Border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00ffcc" stroke-width="12" />

  <!-- Background Neon Music Waves -->
  <circle cx="256" cy="280" r="190" fill="none" stroke="rgba(255, 0, 128, 0.25)" stroke-width="6" />
  <circle cx="256" cy="280" r="230" fill="none" stroke="rgba(0, 255, 204, 0.2)" stroke-width="4" stroke-dasharray="16, 12" />

  <!-- Goblin Ears -->
  <!-- Left Ear -->
  <polygon points="140,250 30,220 130,310" fill="#2d6b2d" stroke="#00ffcc" stroke-width="4" />
  <polygon points="135,255 60,230 125,295" fill="#e8789d" />
  <!-- Right Ear -->
  <polygon points="372,250 482,220 382,310" fill="#2d6b2d" stroke="#00ffcc" stroke-width="4" />
  <polygon points="377,255 452,230 387,295" fill="#e8789d" />

  <!-- DJ Headphones Band -->
  <path d="M 140,220 A 130,130 0 0,1 372,220" fill="none" stroke="#00e5ff" stroke-width="24" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Goblin Head -->
  <rect x="140" y="180" width="232" height="200" rx="45" fill="#4da64d" stroke="#286b28" stroke-width="8" />

  <!-- Headphone Ear Cups -->
  <rect x="110" y="200" width="45" height="95" rx="18" fill="#7822d6" stroke="#00ffff" stroke-width="6" filter="url(#neonGlow)" />
  <rect x="357" y="200" width="45" height="95" rx="18" fill="#7822d6" stroke="#00ffff" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Expressive Big Eyes -->
  <rect x="175" y="225" width="55" height="60" rx="12" fill="#ffffff" />
  <rect x="282" y="225" width="55" height="60" rx="12" fill="#ffffff" />
  <circle cx="205" cy="255" r="20" fill="#111111" />
  <circle cx="305" cy="255" r="20" fill="#111111" />
  <circle cx="198" cy="248" r="7" fill="#ffffff" />
  <circle cx="298" cy="248" r="7" fill="#ffffff" />

  <!-- Goblin Nose -->
  <rect x="238" y="275" width="36" height="30" rx="10" fill="#2f7831" />

  <!-- Cheerful Smile with Little Fang -->
  <path d="M 200,335 Q 256,370 312,335" fill="none" stroke="#1b3d1c" stroke-width="9" stroke-linecap="round" />
  <polygon points="215,340 225,340 220,355" fill="#ffffff" />

  <!-- Party Hat (Golden & Neon Pink) -->
  <polygon points="256,40 180,185 332,185" fill="url(#partyHatGrad)" stroke="#ffd700" stroke-width="6" />
  <rect x="205" y="140" width="102" height="18" rx="6" fill="url(#goldGrad)" />
  <circle cx="256" cy="40" r="20" fill="url(#goldGrad)" filter="url(#neonGlow)" />

  <!-- Birthday Cake Icon in Corner -->
  <g transform="translate(360, 360) scale(0.7)">
    <rect x="0" y="50" width="140" height="60" rx="12" fill="#ff007f" stroke="#ffffff" stroke-width="6" />
    <rect x="20" y="10" width="100" height="45" rx="10" fill="#00ffcc" stroke="#ffffff" stroke-width="5" />
    <!-- Candle -->
    <rect x="62" y="-25" width="16" height="35" rx="4" fill="#ffd700" />
    <circle cx="70" cy="-35" r="14" fill="#ff3300" filter="url(#neonGlow)" />
  </g>
</svg>

</body>
</html>
